# Agentic OS Docker Compose
# Infrastructure for local development

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  vector-db:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    # TODO: switch ChromaDB if preferred (lighter)

volumes:
  redis-data:
  qdrant-data: